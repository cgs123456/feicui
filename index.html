<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale=1 禁用 Chrome auto-fit：轮播轨道的固有溢出会触发 shrink-to-fit
       把布局视口放宽到 430 并整体缩小，fixed 底栏点击坐标随之全偏；
       Chrome 安卓仍保留系统级强制缩放，不影响无障碍 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07C160" />
  <meta name="description" content="AI 驱动的翡翠珠宝电商平台" />
  <!-- manifest 与 SW 由 vite-plugin-pwa 构建时注入，勿手写重复 link -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>AI翡翠匹配</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    body { background: #f5f5f5; }
    #app { display: flex; flex-direction: column; min-height: 100dvh; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
